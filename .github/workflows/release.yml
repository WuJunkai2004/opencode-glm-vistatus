name: Release

# Manual trigger: bumps VERSION.txt per the versioning rule, commits + tags,
# and publishes a GitHub Release. The VERSION.txt commit then triggers
# publish.yml to ship the package to npm.
on:
  workflow_dispatch:

permissions:
  contents: write # commit, tag, create release

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          token: ${{ secrets.GH_PAT }}

      - uses: actions/setup-node@v7
        with:
          node-version: 22

      - name: Bump version
        run: node scripts/bump-version.mjs

      - name: Capture new version
        id: ver
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          echo "version=$v" >> "$GITHUB_OUTPUT"

      - name: Sync package.json + _version.ts
        run: |
          npm run sync-version
          npm run version

      - name: Commit, tag, push
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add VERSION.txt package.json
          git commit -m "release: v${{ steps.ver.outputs.version }} released"
          git tag "v${{ steps.ver.outputs.version }}"
          git push && git push --tags

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v3
        with:
          tag_name: "v${{ steps.ver.outputs.version }}"
          name: "v${{ steps.ver.outputs.version }}"
          generate_release_notes: true
