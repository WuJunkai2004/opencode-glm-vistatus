name: Publish to npm

# Fires only when VERSION.txt changes on main (e.g. a release.yml commit,
# or a manual edit). Syncs package.json, builds, publishes to npm, then
# commits the synced package.json back to main.
on:
  push:
    branches: [main]
    paths:
      - "VERSION.txt"

permissions:
  contents: write
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: "https://registry.npmjs.org"
          cache: npm

      - run: npm ci

      - name: Sync VERSION.txt → package.json + _version.ts
        run: |
          npm run sync-version

      - name: Build
        run: npm run build

      - name: Publish
        run: npm publish --provenance --access public

      - name: Commit synced package.json (github-actions[bot] via GITHUB_TOKEN)
        run: |
          v="$(tr -d '[:space:]' < VERSION.txt)"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add package.json
          if git diff --cached --quiet; then
            echo "package.json already in sync — nothing to commit"
          else
            git commit -m "chore: sync package.json to VERSION.txt (v${v})"
            git push
          fi
